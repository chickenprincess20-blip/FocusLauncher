plugins {
    id 'com.android.application' version '8.2.2'
}

android {
    namespace 'com.example.focuslauncher'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.focuslauncher"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
