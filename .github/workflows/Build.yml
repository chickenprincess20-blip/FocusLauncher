name: Build APK Launcher
on: [push, workflow_dispatch]
jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout Code
uses: actions/checkout@v4
- name: Set up JDK 17
uses: actions/setup-java@v4
with:
distribution: 'zulu'
java-version: '17'
- name: Initialize Android project configuration
run: |
echo "sdk.dir=$ANDROID_HOME" > local.properties
gradle init --type basic --dsl groovy --package com.example.focuslauncher
- name: Compile and Assemble Debug APK
run: ./gradlew assembleDebug || gradle assembleDebug
- name: Upload Finished APK File
uses: actions/upload-artifact@v4
with:
name: focus-launcher-apk
path: app/build/outputs/apk/debug/*.apk
